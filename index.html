<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HotelManager PRO · Rezerwacje</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=29">
</head>
<body>
  <header class="topbar">
    <div class="topbar__left">
      <span class="brand">HotelManager PRO</span>
      <nav class="nav" aria-label="Główna nawigacja">
        <a href="#" class="nav__item">Start</a>
        <a href="#" class="nav__item is-active" aria-current="page">Rezerwacje</a>
        <a href="#" class="nav__item">Pokoje</a>
        <a href="#" class="nav__item">Goście</a>
        <a href="#" class="nav__item">Płatności</a>
        <a href="#" class="nav__item">Raporty</a>
        <a href="#" class="nav__item">Więcej</a>
      </nav>
    </div>
    <div class="topbar__right">
      <span class="hotel-name">ACME Corp Hotel</span>
      <span class="avatar" aria-label="Zalogowany: AD">AD</span>
    </div>
  </header>

  <main class="content">
    <section class="day-header">
      <div class="day-nav">
        <button class="icon-btn" id="prevDay" aria-label="Poprzedni dzień">
          <img src="assets/icons/chev-left.svg" width="18" height="18" alt="">
        </button>
        <h1 class="day-title" id="dayTitle"></h1>
        <button class="icon-btn" id="nextDay" aria-label="Następny dzień">
          <img src="assets/icons/chev-right.svg" width="18" height="18" alt="">
        </button>
        <button class="icon-btn" id="dayPicker" aria-haspopup="dialog" aria-expanded="false" aria-label="Wybierz dzień z kalendarza" title="Wybierz dzień z kalendarza">
          <img src="assets/icons/cal.svg" width="18" height="18" alt="">
        </button>
      </div>

      <button class="btn btn--outline stats-toggle" id="moreStats" aria-expanded="false" aria-controls="statsPop">
        Statystyki obłożenia
        <img src="assets/icons/chev-stats.svg" width="14" height="14" alt="">
      </button>
    </section>

    <section class="stats" id="statsPop" aria-label="Statystyki obłożenia" inert>
      <div class="stats__inner" id="statsInner"></div>
    </section>

    <section class="card" id="card"></section>
  </main>

  <div class="menu" id="menu" role="menu" hidden></div>
  <div class="calendar" id="calendar" role="dialog" aria-label="Kalendarz" hidden></div>
  <div class="modal-backdrop" id="modal" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js?v=29"></script>
</body>
</html>
